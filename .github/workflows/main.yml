name: Automation
on:
  push:
    branches: [ main, v5.x ]
    tags: [ '**' ]
  release:
    types: [ published ]
  pull_request:
    branches: [ '**' ]
# A new commit on a pull request cancels the run for the previous one.
# Every other run gets a group of its own, so a deploy is never cancelled or left waiting.
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}
jobs:
  test:
    name: test (${{ matrix.browser }})
    runs-on: ubuntu-latest
    # WebKit is advisory: a failure there doesn't stop the build
    continue-on-error: ${{ matrix.browser == 'webkit' }}
    strategy:
      fail-fast: false
      matrix:
        browser: [ chromium, firefox, webkit ]
    steps:
    - uses: actions/checkout@v7
    - name: Use Node.js 24.x
      uses: actions/setup-node@v7
      with:
        node-version: 24
        cache: npm
    - name: Install dependencies
      run: npm ci

    - name: Get Playwright version
      id: playwright
      run: echo "version=$(node -p "require('playwright/package.json').version")" >> "$GITHUB_OUTPUT"

    - name: Cache Playwright browser
      id: playwright-cache
      uses: actions/cache@v6
      with:
        path: ~/.cache/ms-playwright
        key: playwright-${{ runner.os }}-${{ steps.playwright.outputs.version }}-${{ matrix.browser }}

    - name: Install Playwright browser
      if: steps.playwright-cache.outputs.cache-hit != 'true'
      run: npx playwright install --with-deps ${{ matrix.browser }}

    - name: Install Playwright system dependencies
      if: steps.playwright-cache.outputs.cache-hit == 'true'
      run: npx playwright install-deps ${{ matrix.browser }}

    # Runners have no audio output, and Firefox's AudioContext never starts without one
    - name: Start a silent audio output
      if: matrix.browser == 'firefox'
      run: |
        sudo apt-get install -y --no-install-recommends pulseaudio
        pulseaudio --start --exit-idle-time=-1

    - name: Run Unit Tests
      run: npx vitest run --project ${{ matrix.browser }}
      timeout-minutes: 3

  build:
    needs: test
    env:
      AWS_S3_BUCKET: ${{ secrets.AWS_S3_BUCKET }}
      AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID || '' }}
      AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
      AWS_REGION: ${{ secrets.AWS_REGION }}
      SOURCE_DIR: 'deploy'
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v7
    - name: Use Node.js 24.x
      uses: actions/setup-node@v7
      with:
        node-version: 24
        cache: npm
    - name: Install dependencies
      run: npm ci

    - name: Type-check Tests
      run: npx tsc -p test/tsconfig.json

    - name: Prepare Deploy
      run: npm run deploy:ci

    # All the below are deploy-related steps
    - name: Extract Branch Name
      id: branch_name
      if: github.event_name == 'push' && !contains(github.ref, 'refs/tags')
      run: echo BRANCH_NAME=${GITHUB_REF/refs\/heads\//} >> $GITHUB_OUTPUT

    - name: Extract Tag Name
      id: tag_name
      if: github.event_name == 'release' || contains(github.ref, 'refs/tags')
      run: echo TAG_NAME=${GITHUB_REF/refs\/tags\//} >> $GITHUB_OUTPUT

    # Examples:
    # 1) PR feature/acme merged into dev
    # 2) branch A merged into branch B
    # 3) branch A pushed directly to git
    - name: Deploy Non-Tag Branches
      if: github.event_name == 'push' && !contains(github.ref, 'refs/tags') && env.AWS_ACCESS_KEY_ID != ''
      run: |
        aws s3 sync "$SOURCE_DIR" "s3://$AWS_S3_BUCKET/$DEST_DIR" --region "${AWS_REGION:-us-east-1}" \
          --no-progress --acl public-read --follow-symlinks --delete --cache-control "max-age=60"
      env:
        DEST_DIR: ${{ steps.branch_name.outputs.BRANCH_NAME }}

    # Release is published and deployed into s3://bucket-name/v5.22/
    - name: Deploy Released Branches
      if: (github.event_name == 'release' || contains(github.ref, 'refs/tags')) && env.AWS_ACCESS_KEY_ID != ''
      run: |
        aws s3 sync "$SOURCE_DIR" "s3://$AWS_S3_BUCKET/$DEST_DIR" --region "${AWS_REGION:-us-east-1}" \
          --no-progress --acl public-read --follow-symlinks --delete --cache-control "max-age=2592000"
      env:
        DEST_DIR: ${{ steps.tag_name.outputs.TAG_NAME }}

    # Same release from previous deployed into s3://bucket-name/release/
    - name: Deploy Latest Release
      if: (github.event_name == 'release' || contains(github.ref, 'refs/tags')) && env.AWS_ACCESS_KEY_ID != ''
      run: |
        aws s3 sync "$SOURCE_DIR" "s3://$AWS_S3_BUCKET/$DEST_DIR" --region "${AWS_REGION:-us-east-1}" \
          --no-progress --acl public-read --follow-symlinks --delete --cache-control "max-age=1209600"
      env:
        DEST_DIR: 'latest'

    # Automatically attach browser files to release
    - name: Upload to Release
      if: github.event_name == 'release'
      uses: softprops/action-gh-release@v3
      with:
        files: dist/*